name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Rust workspace
        id: rust
        run: |
          if [ -d engine ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.rust.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: steps.rust.outputs.present == 'true'
        run: cargo test --manifest-path engine/Cargo.toml
      - if: steps.rust.outputs.present == 'true'
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings
      - if: steps.rust.outputs.present == 'true'
        run: cargo fmt --manifest-path engine/Cargo.toml --check
