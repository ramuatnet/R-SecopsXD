name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install (zero runtime deps — lockfile only for tooling)
        run: npm ci || npm install
      - name: Template pack lint (N3/N7/N9 — a template without '# source:' fails the gate)
        run: npm run lint:templates
      - name: Typecheck (strict strip-only TS)
        run: npx tsc --noEmit
      - name: Canary — parser mapping + integrity (N10)
        run: npm run canary
      - name: Test suite (includes egress-audit of nuclei argv, G4)
        run: npm test
