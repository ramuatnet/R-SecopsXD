id: rsec-default-credential-page
info:
  name: Generic admin login page exposed (default branding)
  author: r-secopsxd
  severity: info
  description: Generic admin login page exposed (default branding) - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/10-Business_Logic_Data_Validation/README
  classification:
    cwe-id: CWE-1188
  tags: admin,default,rsec
# source: WSTG-AUTHN; CWE-1188

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/administrator"
      - "{{BaseURL}}/wp-login.php"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<input"
          - "type="password""
        condition: and
      - type: status
        part: status
        status:
          - 200
