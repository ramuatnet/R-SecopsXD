id: rsec-openapi-spec-exposed
info:
  name: OpenAPI/Swagger specification exposed
  author: r-secopsxd
  severity: info
  description: OpenAPI/Swagger specification exposed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-api-security/
  classification:
    cwe-id: CWE-200
  tags: openapi,swagger,rsec
# source: OWASP API Security; CWE-200

http:
  - method: GET
    path:
      - "{{BaseURL}}/openapi.json"
      - "{{BaseURL}}/swagger.json"
      - "{{BaseURL}}/v2/swagger.json"
      - "{{BaseURL}}/v3/api-docs"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - ""openapi""
          - ""swagger""
        condition: or
      - type: status
        part: status
        status:
          - 200
