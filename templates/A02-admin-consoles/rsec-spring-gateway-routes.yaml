id: rsec-spring-gateway-routes
info:
  name: Spring Cloud Gateway routes exposed
  author: r-secopsxd
  severity: high
  description: Spring Cloud Gateway routes exposed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-200
  tags: spring,gateway,rsec
# source: WSTG-CONF; CWE-200

http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator/gateway/routes"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "route_id"
          - "predicate"
        condition: or
      - type: status
        status:
          - 200
