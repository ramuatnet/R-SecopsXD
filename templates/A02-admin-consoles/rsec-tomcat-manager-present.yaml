id: rsec-tomcat-manager-present
info:
  name: Tomcat Manager present (auth required)
  author: r-secopsxd
  severity: info
  description: Tomcat Manager present (auth required) - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-650
  tags: tomcat,manager,rsec
# source: WSTG-CONF; CWE-650

http:
  - method: GET
    path:
      - "{{BaseURL}}/manager/html"
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "401"
          - "Tomcat"
        condition: and
      - type: status
        part: status
        status:
          - 401
