id: rsec-nginx-autoindex
info:
  name: Directory listing enabled
  author: r-secopsxd
  severity: low
  description: Directory listing enabled - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-548
  tags: listing,nginx,rsec
# source: WSTG-CONF; CWE-548

http:
  - method: GET
    path:
      - "{{BaseURL}}/assets/"
      - "{{BaseURL}}/files/"
      - "{{BaseURL}}/backup/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Index of /"
          - "Directory listing for"
        condition: or
      - type: status
        part: status
        status:
          - 200
