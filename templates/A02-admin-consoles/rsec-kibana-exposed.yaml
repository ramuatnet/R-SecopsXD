id: rsec-kibana-exposed
info:
  name: Kibana exposed
  author: r-secopsxd
  severity: medium
  description: Kibana exposed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-650
  tags: kibana,elastic,rsec
# source: WSTG-CONF; CWE-650

http:
  - method: GET
    path:
      - "{{BaseURL}}/app/kibana"
      - "{{BaseURL}}/login"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "kibana"
          - "elastic"
        condition: or
      - type: status
        status:
          - 200
