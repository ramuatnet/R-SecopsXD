id: rsec-jenkins-presence
info:
  name: Jenkins CI exposed
  author: r-secopsxd
  severity: medium
  description: Jenkins CI exposed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-650
  tags: jenkins,ci,rsec
# source: WSTG-CONF; CWE-650

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "X-Jenkins"
        condition: or
      - type: status
        part: status
        status:
          - 200
