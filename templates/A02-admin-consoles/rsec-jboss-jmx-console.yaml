id: rsec-jboss-jmx-console
info:
  name: JBoss JMX console exposed
  author: r-secopsxd
  severity: high
  description: JBoss JMX console exposed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-650
  tags: jboss,jmx,rsec
# source: WSTG-CONF; CWE-650

http:
  - method: GET
    path:
      - "{{BaseURL}}/jmx-console/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "JBoss JMX Management Console"
          - "jboss.admin"
        condition: or
      - type: status
        status:
          - 200
