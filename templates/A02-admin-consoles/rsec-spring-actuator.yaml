id: rsec-spring-actuator
info:
  name: Spring Boot Actuator exposed
  author: r-secopsxd
  severity: medium
  description: Spring Boot Actuator exposed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-200
  tags: spring,actuator,rsec
# source: WSTG-CONF; CWE-200

http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator"
      - "{{BaseURL}}/actuator/health"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - ""_links""
          - ""self""
        condition: and
      - type: status
        part: status
        status:
          - 200
