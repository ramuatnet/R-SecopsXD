id: rsec-phpmyadmin-exposed
info:
  name: phpMyAdmin exposed
  author: r-secopsxd
  severity: medium
  description: phpMyAdmin exposed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-650
  tags: phpmyadmin,db,rsec
# source: WSTG-CONF; CWE-650

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpmyadmin/"
      - "{{BaseURL}}/pma/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "phpMyAdmin"
        condition: and
      - type: status
        status:
          - 200
