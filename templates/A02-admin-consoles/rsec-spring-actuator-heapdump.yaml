id: rsec-spring-actuator-heapdump
info:
  name: Spring Boot Actuator heapdump exposed
  author: r-secopsxd
  severity: high
  description: Spring Boot Actuator heapdump exposed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-200
  tags: spring,actuator,rsec
# source: WSTG-CONF; CWE-200

http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator/heapdump"
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "application/vnd.springframework"
        condition: and
      - type: status
        status:
          - 200
