id: rsec-php-error-disclosure
info:
  name: PHP error disclosure
  author: r-secopsxd
  severity: medium
  description: PHP error disclosure - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-209
  tags: errors,php,rsec
# source: WSTG-CONF; CWE-209

http:
  - method: GET
    path:
      - "{{BaseURL}}/rsec-nonexistent-probe"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Fatal error"
          - "Warning:"
        condition: or
      - type: status
        part: status
        status:
          - 500
