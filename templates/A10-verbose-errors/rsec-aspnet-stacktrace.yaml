id: rsec-aspnet-stacktrace
info:
  name: ASP.NET error details disclosed
  author: r-secopsxd
  severity: medium
  description: ASP.NET error details disclosed - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-209
  tags: errors,aspnet,rsec
# source: WSTG-CONF; CWE-209

http:
  - method: GET
    path:
      - "{{BaseURL}}/rsec-nonexistent-probe"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Server Error in"
          - "Stack Trace"
        condition: and
      - type: status
        status:
          - 500
