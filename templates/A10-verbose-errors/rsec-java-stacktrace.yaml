id: rsec-java-stacktrace
info:
  name: Java stack trace disclosed on error
  author: r-secopsxd
  severity: medium
  description: Java stack trace disclosed on error - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-209
  tags: errors,java,rsec
# source: WSTG-CONF; CWE-209

http:
  - method: GET
    path:
      - "{{BaseURL}}/rsec-nonexistent-probe"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "at java."
          - "at org."
          - "java.lang.Exception"
        condition: or
      - type: status
        status:
          - 500
