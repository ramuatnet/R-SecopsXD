id: rsec-git-config-exposure
info:
  name: Exposed .git/config
  author: r-secopsxd
  severity: high
  description: Exposed .git/config - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-538
  tags: exposure,git,rsec
# source: WSTG-CONF; CWE-538

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "[core]"
          - "repositoryformatversion"
        condition: and
      - type: status
        status:
          - 200
