id: rsec-svn-entries-exposure
info:
  name: Exposed SVN metadata
  author: r-secopsxd
  severity: medium
  description: Exposed SVN metadata - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-538
  tags: exposure,svn,rsec
# source: WSTG-CONF; CWE-538

http:
  - method: GET
    path:
      - "{{BaseURL}}/.svn/entries"
      - "{{BaseURL}}/.svn/wc.db"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "svn"
          - "SQLite format 3"
        condition: or
      - type: status
        status:
          - 200
