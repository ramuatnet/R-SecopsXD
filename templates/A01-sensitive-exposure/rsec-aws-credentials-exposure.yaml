id: rsec-aws-credentials-exposure
info:
  name: Exposed AWS credentials file
  author: r-secopsxd
  severity: critical
  description: Exposed AWS credentials file - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-522
  tags: exposure,aws,rsec
# source: WSTG-CONF; CWE-522

http:
  - method: GET
    path:
      - "{{BaseURL}}/.aws/credentials"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "aws_access_key_id"
        condition: and
      - type: status
        status:
          - 200
