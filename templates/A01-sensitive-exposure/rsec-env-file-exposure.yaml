id: rsec-env-file-exposure
info:
  name: Exposed .env file
  author: r-secopsxd
  severity: high
  description: Exposed .env file - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-200
  tags: exposure,dotenv,rsec
# source: WSTG-CONF; CWE-200

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "="
          - "KEY"
        condition: and
      - type: word
        part: body
        words:
          - "DB_"
          - "SECRET"
          - "PASSWORD"
          - "API_KEY"
          - "TOKEN"
        condition: or
      - type: status
        part: status
        status:
          - 200
