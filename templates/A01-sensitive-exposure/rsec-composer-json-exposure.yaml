id: rsec-composer-json-exposure
info:
  name: Exposed composer.json (dependency disclosure)
  author: r-secopsxd
  severity: info
  description: Exposed composer.json (dependency disclosure) - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/README
  classification:
    cwe-id: CWE-200
  tags: exposure,php,dependencies,rsec
# source: WSTG-INFO; CWE-200

http:
  - method: GET
    path:
      - "{{BaseURL}}/composer.json"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - ""require""
          - ""name""
        condition: and
      - type: status
        status:
          - 200
