id: rsec-idea-workspace-exposure
info:
  name: Exposed IDE workspace
  author: r-secopsxd
  severity: medium
  description: Exposed IDE workspace - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration/README
  classification:
    cwe-id: CWE-538
  tags: exposure,ide,rsec
# source: WSTG-CONF; CWE-538

http:
  - method: GET
    path:
      - "{{BaseURL}}/.idea/workspace.xml"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<project version"
          - "component"
        condition: and
      - type: status
        status:
          - 200
