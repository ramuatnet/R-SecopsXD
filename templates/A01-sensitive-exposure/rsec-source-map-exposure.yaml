id: rsec-source-map-exposure
info:
  name: Exposed JavaScript source maps
  author: r-secopsxd
  severity: medium
  description: Exposed JavaScript source maps - curated in-house check derived from the cited source.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/README
  classification:
    cwe-id: CWE-540
  tags: exposure,sourcemap,rsec
# source: WSTG-INFO; CWE-540

http:
  - method: GET
    path:
      - "{{BaseURL}}/main.js.map"
      - "{{BaseURL}}/app.js.map"
      - "{{BaseURL}}/bundle.js.map"
      - "{{BaseURL}}/static/js/main.js.map"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - ""sources""
          - ""mappings""
        condition: and
      - type: status
        part: status
        status:
          - 200
